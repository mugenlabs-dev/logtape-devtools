name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Jobs only read the repo. Deploys authenticate with VERCEL_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 65.1.0

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - run: bash scripts/ci-changed.sh test

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-changed.sh gha

  check:
    name: Lint & Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Lint & Format
        run: pnpm lint

      # pnpm audit has no --filter; --dir does not limit a workspace audit.
      # scripts/audit-published.sh keeps only packages/core production paths.
      - name: Audit published package
        run: pnpm audit:published

      - name: Audit workspace (non-blocking)
        continue-on-error: true
        run: pnpm audit:workspace

      - name: Run unit tests
        run: pnpm test:ci

      - name: Script tests
        run: bash scripts/audit-published.test.sh

  storybook:
    name: Storybook Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      # Ships Chromium and its system dependencies. Keep the tag in sync with
      # the Playwright version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      # Runs the unit tests too, so coverage covers both projects
      - name: Run Storybook tests with coverage
        run: pnpm test:coverage

  build:
    name: Build & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Check package exports
        run: pnpm lint:package

      - name: Typecheck
        run: pnpm exec tsgo -p packages/core --noEmit && pnpm exec tsgo -p apps/demo --noEmit

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [changes, check, storybook, build]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 4
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g "vercel@$VERCEL_CLI_VERSION"

      # The Vercel CLI reads VERCEL_TOKEN from the environment. It is set per step,
      # so the token stays off command lines and away from `pnpm install` scripts.
      # Production env, so `vercel build --prod` bakes in VITE_PUBLIC_POSTHOG_KEY.
      - run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview (skip production alias)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --skip-domain)
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests
        run: pnpm build && pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  e2e-preview:
    name: E2E Tests (preview)
    needs: [changes, deploy-preview]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests against preview
        run: pnpm test:e2e
        env:
          CI: true
          BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-preview
          path: playwright-report/
          retention-days: 30

  promote:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [changes, e2e, e2e-preview, deploy-preview]
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 2
    steps:
      - run: npm add -g "vercel@$VERCEL_CLI_VERSION"
      - name: Promote preview to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote ${{ needs.deploy-preview.outputs.preview-url }} --yes --scope=${{ secrets.VERCEL_ORG_ID }}
