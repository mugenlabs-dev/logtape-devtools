<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogTape DevTools</title>
    <meta
      name="description"
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
    >
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#0a0a0a">
    <!-- Open Graph -->
    <meta property="og:title" content="LogTape DevTools">
    <meta
      property="og:description"
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
    >
    <meta property="og:image" content="https://logtape-devtools.mugenlabs.dev/og-image.png">
    <meta property="og:url" content="https://logtape-devtools.mugenlabs.dev/">
    <meta property="og:type" content="website">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LogTape DevTools">
    <meta
      name="twitter:description"
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
    >
    <meta name="twitter:image" content="https://logtape-devtools.mugenlabs.dev/og-image.png">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <script>
    "use strict";
    (() => {
      let saved = null;
      try {
        saved = localStorage.getItem("logtape-devtools:theme");
      } catch {
        // localStorage unavailable
      }
      let theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (saved === "dark" || saved === "light") {
        theme = saved;
      }
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.style.setProperty("--bg-primary", theme === "light" ? "#f8f8f8" : "#0a0a0a");
      root.style.setProperty("--text-primary", theme === "light" ? "#1a1a1a" : "#fff");
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
