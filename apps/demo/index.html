<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LogTape DevTools</title>
    <meta
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
      name="description"
    >
    <link href="/favicon.png" rel="icon" type="image/png">
    <meta content="#0a0a0a" name="theme-color">
    <!-- Open Graph -->
    <meta content="LogTape DevTools" property="og:title">
    <meta
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
      property="og:description"
    >
    <meta content="https://logtape-devtools.mugenlabs.dev/og-image.png" property="og:image">
    <meta content="https://logtape-devtools.mugenlabs.dev/" property="og:url">
    <meta content="website" property="og:type">
    <!-- Twitter Card -->
    <meta content="summary_large_image" name="twitter:card">
    <meta content="LogTape DevTools" name="twitter:title">
    <meta
      content="A TanStack DevTools plugin for inspecting LogTape logs in the browser"
      name="twitter:description"
    >
    <meta content="https://logtape-devtools.mugenlabs.dev/og-image.png" name="twitter:image">
    <meta content="nosniff" http-equiv="X-Content-Type-Options">
    <meta content="DENY" http-equiv="X-Frame-Options">
    <script>
    "use strict";
    (() => {
      let saved = null;
      try {
        saved = localStorage.getItem("logtape-devtools:theme");
      } catch {
        // localStorage unavailable
      }
      let theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (saved === "dark" || saved === "light") {
        theme = saved;
      }
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.style.setProperty("--bg-primary", theme === "light" ? "#f8f8f8" : "#0a0a0a");
      root.style.setProperty("--text-primary", theme === "light" ? "#1a1a1a" : "#fff");
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
